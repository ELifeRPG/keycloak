name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/eliferpg/keycloak
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE:ci" .

      # Every Renovate bump (Keycloak or a plugin) goes through this before it can be merged.
      - name: Smoke test (providers load)
        run: scripts/smoke-test.sh "$IMAGE:ci"

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          SHA_TAG="sha-${GITHUB_SHA::7}"
          for tag in latest "$SHA_TAG"; do
            docker tag "$IMAGE:ci" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
